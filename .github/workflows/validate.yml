name: Validate Marketplace & Hassfest

# dev is the integration branch: a push to dev that passes every job fast-forwards main, the branch
# HACS installs from. main is never ahead of a green run.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  validate_marketplace:
    name: Marketplace (HACS) Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Run Marketplace validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Home Assistant Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  lint_and_test:
    name: Ruff Lint, Studio Bundle Parity & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install lint and test dependencies
        run: pip install --upgrade pip ruff pytest pytest-asyncio pytest-cov voluptuous Pillow aiohttp
      - name: Verify static architecture, security, and Studio guardrails
        run: python tools/verify_ha.py
      - name: Verify Studio TypeScript bundle parity
        run: npm --prefix frontend_src run check
      - name: Run ruff static analysis
        run: ruff check custom_components/latter tests
      - name: Run pytest integration suite with coverage gate
        run: pytest tests --cov=custom_components.latter --cov-fail-under=75 -q

  promote:
    name: Fast-forward main to this commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [validate_marketplace, hassfest, lint_and_test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fast-forward main (refuses anything that is not a fast-forward)
        run: git push origin "${GITHUB_SHA}:refs/heads/main"
