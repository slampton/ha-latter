name: Validate Marketplace & Hassfest

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  validate_marketplace:
    name: Marketplace (HACS) Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Run Marketplace validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Home Assistant Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  lint_and_test:
    name: Ruff Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install --upgrade pip ruff
      - name: Run ruff static analysis
        run: ruff check custom_components/latter tests --select E9,F63,F7,F82,F401,F811,F841
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
