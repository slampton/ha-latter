name: Build & Attach Marketplace Release Asset (latter.zip)

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package-hacs-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify release tag matches manifest.json version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG_VER="${TAG#v}"
          MANIFEST_VER=$(python3 -c 'import json; print(json.load(open("custom_components/latter/manifest.json", encoding="utf-8"))["version"])')
          if [[ "${TAG_VER}" != "${MANIFEST_VER}" ]]; then
            echo "::error::Release tag ${TAG} (${TAG_VER}) does not match custom_components/latter/manifest.json (${MANIFEST_VER})"
            exit 1
          fi

      - name: Build latter.zip from custom_components/latter
        run: |
          cd custom_components/latter
          zip -r ../../latter.zip . -x "*.pyc" "*__pycache__*"

      - name: Attach latter.zip to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" latter.zip --clobber
