name: Build & Attach HACS Release Asset (latter.zip)

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package-hacs-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build latter.zip from custom_components/latter
        run: |
          cd custom_components/latter
          zip -r ../../latter.zip . -x "*.pyc" "*__pycache__*"

      - name: Attach latter.zip to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" latter.zip

