[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-latter"
version = "3.0.0"
description = "Home Assistant middleware and Studio panel for Latter displays and BLE presence fabric."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
test = [
    "PyTurboJPEG>=1.8",
    "aiohttp>=3.14",
    "aiousbwatcher>=1.1",
    "av>=19.0",
    "ha-ffmpeg>=3.2",
    "homeassistant-stubs==2026.10.0",
    "hypothesis>=6.170",
    "mypy>=2.4",
    "pillow>=12.0",
    "probatio>=0.13",
    "pytest-cov>=7.0",
    "pytest-homeassistant-custom-component==0.13.375",
    "pytest-xdist>=3.8",
    "ruff>=0.17",
    "serialx>=1.11",
    "voluptuous>=0.16",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.latter"]
omit = ["custom_components/latter/frontend/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py314"
line-length = 110
extend-exclude = ["custom_components/latter/frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "ASYNC", "RUF", "S", "PERF", "PLR"]
ignore = ["E501", "SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR1711", "PLR2004"]
"**/tests/**" = ["S101", "S105", "S106", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR1711", "PLR2004"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components.latter", "tests"]

[tool.mypy]
python_version = "3.14"
strict = true
show_error_codes = true
explicit_package_bases = true
