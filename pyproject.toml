[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-latter"
version = "3.0.0"
description = "Home Assistant middleware and Studio panel for Latter displays and BLE presence fabric."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
test = [
    "aiohttp>=3.9",
    "pillow>=10.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "voluptuous>=0.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.latter"]
omit = ["custom_components/latter/frontend/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["custom_components/latter/frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "ASYNC", "RUF"]
ignore = ["E501", "SIM105", "SIM108"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components.latter"]
