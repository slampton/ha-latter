notify:
  name: Send notification
  description: Show an on-screen notification, with an optional chime and an optional camera snapshot, on a specific device, the devices in occupied Areas ('occupied_areas'), the devices assigned to a person ('person.<slug>'), or all displays ('all').
  fields:
    target_device:
      name: Target device or routing mode
      description: ESPHome device slug, 'occupied_areas' (occupied Areas only), 'all' (all displays), or a 'person.*' entity ID. If 'occupied_areas' or a person matches no display, nothing is delivered; an unknown device slug is an error.
      required: false
      selector:
        text:
    title:
      name: Alert title
      description: Short heading for the notification banner (e.g., Front Doorbell, Laundry).
      required: false
      default: "Notification"
      selector:
        text:
    message:
      name: Alert message
      description: Body text of the notification (e.g., Someone is at the front door).
      required: true
      selector:
        text:
    priority:
      name: Priority level
      description: Visual urgency of the alert (normal, warning, critical).
      required: false
      default: "normal"
      selector:
        select:
          options:
            - "normal"
            - "warning"
            - "critical"
    duration:
      name: Display duration (seconds)
      description: How many seconds to show the alert overlay on screen.
      required: false
      default: 8
      selector:
        number:
          min: 2
          max: 60
          mode: slider
    chime:
      name: Play chime
      description: Play an alert chime on the device speaker when the notification arrives.
      required: false
      default: true
      selector:
        boolean:
    announce:
      name: Speak message
      description: Also speak the message with TTS on the device (through its Assist satellite or local speaker). The banner chime is skipped when enabled.
      required: false
      default: false
      selector:
        boolean:
    camera_entity:
      name: Camera entity
      description: Optional camera.* entity whose snapshot is shown with the notification.
      required: false
      selector:
        entity:
          domain: camera

intercom_broadcast:
  name: Intercom broadcast
  description: Broadcast a TTS announcement or local audio clip to explicit target speakers, the configured broadcast speakers in occupied Areas ('occupied_areas'), the configured broadcast speakers in a person's current Area ('person.<slug>'), or the System/Device configured broadcast speakers.
  fields:
    target_device:
      name: Calling device or routing mode
      description: Optional calling Latter device slug, 'occupied_areas' (configured broadcast speakers in occupied Areas only), 'all' (configured System broadcast speakers), or a 'person.*' entity ID (configured broadcast speakers in that person's current Area).
      required: false
      selector:
        text:
    message:
      name: Announcement message (TTS)
      description: Text message to announce via Home Assistant TTS.
      required: false
      selector:
        text:
    media_url:
      name: Audio clip URL
      description: Optional Home Assistant media-source:// URI or local /api/latter/ resource to play with announce=true.
      required: false
      selector:
        text:
    target_speakers:
      name: Target speakers
      description: Specific media_player entities to broadcast to (overrides the configured broadcast speaker pool).
      required: false
      selector:
        entity:
          domain: media_player
          multiple: true
    tts_entity:
      name: TTS engine entity
      description: Optional tts.* entity (auto-discovered if omitted).
      required: false
      selector:
        entity:
          domain: tts

set_active_area:
  name: Set active area
  description: Switch the active area context by area_id or area name. The device's speaker follows to the new area when the device's "Media follows this Device" setting is on. On roaming devices with Voice Follows Me enabled, this also moves the device's Home Assistant Area so area-aware Assist commands target it.
  fields:
    area_id:
      name: Area ID or area name
      description: Target Home Assistant area_id or friendly area name.
      required: true
      selector:
        area:
    target_device:
      name: Target device
      description: Optional Latter device.
      required: false
      selector:
        device:
          integration: latter

set_active_speaker:
  name: Set active speaker
  description: Change the active target media_player for the ESPHome device and optionally transfer the active playback queue.
  fields:
    entity_id:
      name: Speaker entity
      description: Target media_player entity_id.
      required: true
      selector:
        entity:
          domain: media_player
    transfer_queue:
      name: Transfer active queue
      description: Transfer the active Music Assistant queue to the new speaker (default true).
      required: false
      default: true
      selector:
        boolean:
    target_device:
      name: Target device
      description: Optional Latter device when running multiple devices.
      required: false
      selector:
        device:
          integration: latter

reset_device:
  name: Reset device to defaults
  description: Reset a Latter device. Device settings erases everything saved on the device (its settings and the Wi-Fi driver's cached data) and restarts it; Wi-Fi credentials and the API key are compiled into the firmware, so it rejoins Home Assistant unchanged. Latter options puts this device's Latter options back to the defaults it got when it was added, keeping its ESPHome binding and its Music Assistant player link.
  fields:
    target_device:
      name: Target device
      description: The Latter device to reset. Required; a reset never falls back to the only device.
      required: true
      selector:
        device:
          integration: latter
    device_settings:
      name: Device settings
      description: Erase everything saved on the device and restart it. Needs Latter firmware Core rev 2026112401 or later. Not available for BLE tags.
      required: false
      default: true
      selector:
        boolean:
    latter_options:
      name: Latter options
      description: Reset this device's Latter options (Studio settings) to their defaults.
      required: false
      default: true
      selector:
        boolean:

navigate:
  name: Navigate display
  description: Navigate one or more Latter displays to a canonical UI page or subpage, optionally keeping sleeping displays dark. Always switches silently during Bedtime Mode.
  fields:
    target_device:
      name: Target device or routing mode
      description: ESPHome device slug, Home Assistant device ID, 'occupied_areas' (occupied Areas only), 'all' (all displays), or a 'person.*' entity ID. Optional when only one Latter device is configured.
      required: false
      selector:
        text:
    route:
      name: Target route
      description: Canonical Latter page or subpage route token (pick a common route or enter any supported Protocol v3 shortcut route).
      required: true
      selector:
        select:
          custom_value: true
          options:
            - "home"
            - "app:clock"
            - "app:music"
            - "music:lyrics"
            - "music:library"
            - "app:cameras"
            - "cameras:grid"
            - "cameras:single"
            - "cameras:carousel"
            - "app:area"
            - "area:light"
            - "area:climate"
            - "app:home_hub"
            - "home_hub:thermostat"
            - "home_hub:entry"
            - "home_hub:alarm"
            - "home_hub:intercom"
            - "home_hub:vacuum"
            - "app:remote"
            - "app:weather"
            - "weather:forecast"
            - "weather:moon"
            - "app:calendar"
            - "calendar:month"
            - "app:time"
            - "time:timers"
            - "app:pinned"
            - "app:tools"
            - "app:games"
            - "app:settings"
            - "quick_actions"
    wake:
      name: Wake sleeping display
      description: Wake a sleeping or screensaver display when switching pages (default true). Set to false to switch silently in the background; Bedtime Mode always forces silent navigation.
      required: false
      default: true
      selector:
        boolean:
