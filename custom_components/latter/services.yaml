device_hello:
  name: Device Hello (Protocol v3 Handshake)
  description: Device-initiated handshake sent by an ESPHome Latter node on API connection to report its contract version, boot ID, and hardware manifest.
  fields:
    target_device:
      name: Target Device
      description: Latter device ID or ESPHome device slug.
      required: true
      selector:
        device:
          integration: latter
    contract:
      name: Protocol Contract Version
      description: Protocol version reported by the firmware (3 for Protocol v3).
      required: false
      default: 3
      selector:
        number:
          min: 1
          max: 10
          mode: box
    boot_id:
      name: Device Boot ID
      description: Random 64-bit hex boot token generated once per cold boot.
      required: false
      selector:
        text:
    manifest:
      name: Hardware Capability Manifest JSON
      description: Compile-time hardware capability manifest JSON reported by the device.
      required: false
      selector:
        text:

music_browse:
  name: Music Browse
  description: Browse Music Assistant speakers, library, podcasts, queues, lyrics, and artist/album bios and push paginated slots to the ESPHome device.
  fields:
    target_device:
      name: Target Device
      description: Optional Latter device (auto-resolved when running a single Latter device).
      required: false
      selector:
        device:
          integration: latter
    mode:
      name: Browse Mode
      description: Category, drill-down, or metadata reader mode to browse.
      required: true
      default: "speakers"
      selector:
        select:
          options:
            - "speakers"
            - "favorites"
            - "playlist"
            - "artist"
            - "album"
            - "radio"
            - "podcast"
            - "audiobook"
            - "track"
            - "artist_albums"
            - "album_tracks"
            - "current_album_tracks"
            - "active_queue"
            - "podcast_episodes"
            - "lyrics"
            - "bio"
    page:
      name: Page Number
      description: 1-based page index.
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 500
          mode: box
    page_size:
      name: Page Size
      description: Items per page (default 5, supports up to 20).
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 20
          mode: box
    search:
      name: Search / Filter Context
      description: Artist name, Album URI/name, Podcast URI, or "Title|Artist|Album" for lyrics/bio modes.
      required: false
      selector:
        text:
    speaker:
      name: Active Speaker
      description: Currently selected media_player entity_id.
      required: false
      selector:
        entity:
          domain: media_player
    last_speaker:
      name: Previous Speaker
      description: Previously active media_player entity_id for priority sorting.
      required: false
      selector:
        entity:
          domain: media_player
    album_sort:
      name: Album Sort Order
      description: Sort order when browsing library albums.
      required: false
      default: "name"
      selector:
        select:
          options:
            - "name"
            - "year_desc"
            - "year"
    artist_album_sort:
      name: Artist Album Sort Order
      description: Sort order when drilling into an artist's albums.
      required: false
      default: "year"
      selector:
        select:
          options:
            - "year"
            - "year_desc"
            - "name"
    podcast_sort:
      name: Podcast Episode Sort Order
      description: Sort order when browsing podcast episodes.
      required: false
      default: "newest"
      selector:
        select:
          options:
            - "newest"
            - "oldest"

set_active_speaker:
  name: Set Active Speaker
  description: Change the active target media_player for the ESPHome device and optionally transfer the active playback queue.
  fields:
    entity_id:
      name: Speaker Entity
      description: Target media_player entity_id.
      required: true
      selector:
        entity:
          domain: media_player
    transfer_queue:
      name: Transfer Active Queue
      description: Transfer the active Music Assistant queue to the new speaker (default true).
      required: false
      default: true
      selector:
        boolean:
    target_device:
      name: Target Device
      description: Optional Latter device when running multiple devices.
      required: false
      selector:
        device:
          integration: latter

media_volume:
  name: Media Volume
  description: Set or step the volume, or toggle mute, on the active speaker. If a volume override is mapped for that speaker (for example an AV receiver), the change goes to the override entity.
  fields:
    target_device:
      name: Target Device
      description: Optional Latter device.
      required: false
      selector:
        device:
          integration: latter
    entity_id:
      name: Speaker Entity Override
      description: Optional speaker entity_id (defaults to the device's active speaker).
      required: false
      selector:
        entity:
          domain: media_player
    action:
      name: Volume Action
      description: Set level, step up/down, or toggle mute.
      required: false
      default: "set"
      selector:
        select:
          options:
            - "set"
            - "up"
            - "down"
            - "mute"
    volume_level:
      name: Volume Level (0.0-1.0 or 0-100)
      description: Target volume level.
      required: false
      selector:
        number:
          min: 0
          max: 100
          mode: slider

set_active_area:
  name: Set Active Area
  description: Switch the active area context by area_id or area name. The device's speaker follows to the new area when the device's "Media follows this Device" setting is on. On roaming devices with Voice Follows Me enabled, this also moves the device's Home Assistant Area so area-aware Assist commands target it.
  fields:
    area_id:
      name: Area ID or Area Name
      description: Target Home Assistant area_id or friendly area name.
      required: true
      selector:
        area:
    target_device:
      name: Target Device
      description: Optional Latter device.
      required: false
      selector:
        device:
          integration: latter

remote_action:
  name: Remote Action
  description: Select one of the up to 10 configured TV remote slots or send a remote command.
  fields:
    slot:
      name: Remote Slot (1-10)
      description: Target remote slot index (1 to 10).
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 10
          mode: box
    action:
      name: Action
      description: Command or slot selection action.
      required: true
      default: "select_slot"
      selector:
        select:
          options:
            - "select_slot"
            - "toggle"
            - "command"
            - "volume_up"
            - "volume_down"
            - "volume_mute"
            - "media_play_pause"
    command:
      name: Remote Command Key
      description: Key name for remote.send_command (e.g., up, down, left, right, select, back, home, menu).
      required: false
      selector:
        text:
    target_device:
      name: Target Device
      description: Optional Latter device.
      required: false
      selector:
        device:
          integration: latter

area_browse:
  name: Area Browse
  description: Browse Home Assistant areas, curated area entities, or home-wide alarm entities and push paginated slots to the ESPHome device.
  fields:
    target_device:
      name: Target Device
      description: Optional Latter device (auto-resolved when running a single Latter device).
      required: false
      selector:
        device:
          integration: latter
    mode:
      name: Browse Mode
      description: Browse areas list, entities inside an area, or home-wide alarm/entities.
      required: false
      default: "entities"
      selector:
        select:
          options:
            - "areas"
            - "entities"
            - "home"
    area_id:
      name: Area ID
      description: Target Home Assistant area_id (defaults to the device's active area).
      required: false
      selector:
        area:
    domain_filter:
      name: Domain Filter
      description: Filter area entities by domain or category.
      required: false
      default: "all"
      selector:
        select:
          options:
            - "all"
            - "scene"
            - "light"
            - "cover"
            - "fan"
            - "switch"
            - "media"
            - "media_player"
            - "climate"
    page:
      name: Page Number
      description: 1-based page index.
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 100
          mode: box
    page_size:
      name: Page Size
      description: Items per page (defaults to device page size, up to 20).
      required: false
      default: 3
      selector:
        number:
          min: 1
          max: 20
          mode: box

area_action:
  name: Area Action
  description: Execute a normalized area control, light color/Kelvin, thermostat, lock, vacuum, or home security alarm action.
  fields:
    target_device:
      name: Target Device
      description: Optional Latter device (auto-resolved when running a single Latter device).
      required: false
      selector:
        device:
          integration: latter
    entity_id:
      name: Target Entity
      description: Target entity_id (or whole_home.thermostat / whole_home.garage / whole_home.lock / whole_home.vacuum).
      required: false
      selector:
        text:
    area_id:
      name: Switch Active Area ID
      description: Optional area_id to set as the active area context.
      required: false
      selector:
        area:
    action:
      name: Action
      description: Normalized command to execute on the entity (lock and alarm_control_panel require an explicit verb).
      required: false
      default: "toggle"
      selector:
        select:
          options:
            - "toggle"
            - "turn_on"
            - "turn_off"
            - "set_level"
            - "set_color"
            - "set_kelvin"
            - "step_up"
            - "step_down"
            - "arm_home"
            - "arm_away"
            - "arm_night"
            - "disarm"
            - "heat"
            - "cool"
            - "auto"
            - "off"
            - "lock"
            - "unlock"
            - "open"
            - "start"
            - "pause"
            - "dock"
    level:
      name: Level / Temperature / Kelvin (0-6500)
      description: Brightness %, cover position %, fan speed %, target temperature, or white color temperature in Kelvin (2000-6500).
      required: false
      selector:
        number:
          min: 0
          max: 6500
          mode: box
    code:
      name: Alarm PIN Code or RGB Hex Color
      description: Optional PIN code for alarm actions, or "#RRGGBB" hex color when action is set_color.
      required: false
      selector:
        text:

calendar_fetch:
  name: Calendar Fetch Agenda
  description: Refresh upcoming system calendar events and push a 5-slot agenda page to the ESPHome device.
  fields:
    target_device:
      name: Target Device
      description: Optional Latter device (auto-resolved when running a single Latter device).
      required: false
      selector:
        device:
          integration: latter
    days:
      name: Lookahead Days
      description: Number of days ahead to query (default 30).
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 60
          mode: box
    page:
      name: Page Number
      description: 1-based page index.
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 20
          mode: box
    page_size:
      name: Page Size
      description: Items per page (default 5).
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 20
          mode: box

calendar_create_event:
  name: Calendar Create Event
  description: Create a new event or quick reminder on the primary system calendar and refresh the agenda sensor.
  fields:
    target_device:
      name: Target Device
      description: Optional Latter device (auto-resolved when running a single Latter device).
      required: false
      selector:
        device:
          integration: latter
    calendar_entity:
      name: Calendar Entity
      description: Target calendar.* entity (defaults to primary configured calendar).
      required: false
      selector:
        entity:
          domain: calendar
    summary:
      name: Event Summary / Title
      description: Title of the calendar event or reminder.
      required: true
      selector:
        text:
    start_date_time:
      name: Start Date & Time
      description: Optional ISO 8601 start datetime string (if omitted, computed from in_minutes).
      required: false
      selector:
        text:
    end_date_time:
      name: End Date & Time
      description: Optional ISO 8601 end datetime string (if omitted, computed from duration_minutes).
      required: false
      selector:
        text:
    in_minutes:
      name: Start In (Minutes from Now)
      description: Relative start offset in minutes when start_date_time is omitted (default 15).
      required: false
      default: 15
      selector:
        number:
          min: 1
          max: 10080
          mode: box
    duration_minutes:
      name: Duration (Minutes)
      description: Event duration in minutes when end_date_time is omitted (default 30).
      required: false
      default: 30
      selector:
        number:
          min: 5
          max: 1440
          mode: box
    description:
      name: Description
      description: Optional event notes or description.
      required: false
      selector:
        text:

intercom_broadcast:
  name: Intercom Broadcast
  description: Broadcast a TTS announcement or recorded audio clip to chosen speakers, the speakers in occupied Areas ('occupied_areas'), the speakers in a person's current Area ('person.<slug>'), or all online Music Assistant speakers.
  fields:
    target_device:
      name: Calling Device or Routing Mode
      description: Optional calling Latter device slug, 'occupied_areas' (speakers in occupied Areas only), or a 'person.*' entity ID (speakers in that person's current Area). Nothing plays if no matching Area is occupied; an unknown device slug is an error.
      required: false
      selector:
        text:
    message:
      name: Announcement Message (TTS)
      description: Text message to announce via Home Assistant TTS.
      required: false
      selector:
        text:
    media_url:
      name: Audio Clip URL
      description: Optional HTTP URL to an audio clip to play with announce=true.
      required: false
      selector:
        text:
    target_speakers:
      name: Target Speakers
      description: Specific media_player entities to broadcast to (defaults to all online Music Assistant players).
      required: false
      selector:
        entity:
          domain: media_player
          multiple: true
    tts_entity:
      name: TTS Engine Entity
      description: Optional tts.* entity (auto-discovered if omitted).
      required: false
      selector:
        entity:
          domain: tts

media_command:
  name: Media Command
  description: Run a playback command (play, pause, toggle, next, previous, stop, seek, play_media, clear_queue) on the active speaker. If the device restarted or slept and its Sendspin buffer is empty, play re-streams the Music Assistant queue.
  fields:
    target_device:
      name: Target Device
      description: Optional Latter device (auto-resolved when running a single Latter device).
      required: false
      selector:
        device:
          integration: latter
    command:
      name: Playback Command
      description: Media transport command to execute.
      required: true
      default: "toggle"
      selector:
        select:
          options:
            - "play"
            - "pause"
            - "toggle"
            - "next"
            - "previous"
            - "stop"
            - "seek"
            - "play_media"
            - "clear_queue"
    entity_id:
      name: Speaker
      description: Optional media_player to command instead of the device's active speaker.
      required: false
      selector:
        entity:
          domain: media_player
    seek_position:
      name: Seek Position (Seconds)
      description: Target playback position in seconds when command is seek.
      required: false
      selector:
        number:
          min: 0
          max: 36000
          mode: box
    media_id:
      name: Media URI / ID
      description: Optional Music Assistant URI or media_content_id when command is play_media.
      required: false
      selector:
        text:
    media_type:
      name: Media Type
      description: Optional media type (music, podcast, audiobook, radio, playlist, album, track).
      required: false
      selector:
        text:
    enqueue:
      name: Enqueue
      description: Optional queue behaviour for play_media (Music Assistant enqueue mode, e.g. play, next, add, replace).
      required: false
      selector:
        select:
          options:
            - "play"
            - "next"
            - "add"
            - "replace"

notify:
  name: Send Notification
  description: Show an on-screen notification, with an optional chime and an optional camera snapshot, on a specific device, the devices in occupied Areas ('occupied_areas'), the devices assigned to a person ('person.<slug>'), or all displays ('all').
  fields:
    target_device:
      name: Target Device or Routing Mode
      description: ESPHome device slug, 'occupied_areas' (occupied Areas only), 'all' (all displays), or a 'person.*' entity ID. If 'occupied_areas' or a person matches no display, nothing is delivered; an unknown device slug is an error.
      required: false
      selector:
        text:
    title:
      name: Alert Title
      description: Short heading for the notification banner (e.g., Front Doorbell, Laundry).
      required: false
      default: "Notification"
      selector:
        text:
    message:
      name: Alert Message
      description: Body text of the notification (e.g., Someone is at the front door).
      required: true
      selector:
        text:
    priority:
      name: Priority Level
      description: Visual urgency of the alert (normal, warning, critical).
      required: false
      default: "normal"
      selector:
        select:
          options:
            - "normal"
            - "warning"
            - "critical"
    duration:
      name: Display Duration (Seconds)
      description: How many seconds to show the alert overlay on screen.
      required: false
      default: 8
      selector:
        number:
          min: 2
          max: 60
          mode: slider
    chime:
      name: Play Chime
      description: Play an alert chime on the device speaker when the notification arrives.
      required: false
      default: true
      selector:
        boolean:
    announce:
      name: Speak Message
      description: Also speak the message with TTS on the device (through its Assist satellite or local speaker). The banner chime is skipped when enabled.
      required: false
      default: false
      selector:
        boolean:
    camera_entity:
      name: Camera Entity
      description: Optional camera.* entity whose snapshot is shown with the notification.
      required: false
      selector:
        entity:
          domain: camera

save_custom_color:
  name: Save Custom Color Profile
  description: Save a custom hex color from the on-device or Studio Color Wheel into the System-Wide Color Library and apply it to the target device.
  fields:
    target_device:
      name: Target Device
      description: Target Latter device.
      required: false
      selector:
        device:
          integration: latter
    hex_color:
      name: Hex Color
      description: 6-digit RGB hex color string (e.g. "#3898FF").
      required: true
      selector:
        text:
    name:
      name: Color Name
      description: Optional friendly name for the System-Wide Color Library.
      required: false
      selector:
        text:

set_dock_apps:
  name: Set Home Dock Apps
  description: Save a device's Home dock apps (the apps shown, in order; Settings is always last). The device sends this from its Home settings; Studio edits the same setting.
  fields:
    target_device:
      name: Target Device
      description: Target Latter device.
      required: false
      selector:
        device:
          integration: latter
    dock_apps:
      name: Dock Apps
      description: Comma-separated apps in order, from music, alarm, area, remote, camera, games, tools.
      required: true
      example: "music,alarm,area,remote,games,tools"
      selector:
        text:

doorbell_intercom:
  name: Doorbell Intercom
  description: Listen to a doorbell camera's noise-reduced audio on a Latter device, reply by push-to-talk or quick reply (spoken with TTS on the camera's media_player), select a carousel camera, unlock the door's lock, or ring other Latter displays with a notification (call_target). There is no live device-to-door audio.
  fields:
    target_device:
      name: Target Device
      description: Optional Latter device (auto-resolved when running a single Latter device).
      required: false
      selector:
        device:
          integration: latter
    action:
      name: Doorbell Action
      description: listen_start / listen_stop / listen_toggle play or stop the camera audio on the device. talk_message and quick_reply speak `message` on the camera's speaker with TTS. unlock_door unlocks the camera's lock. call_target rings the device named in `message` (or all displays) with a critical notification. set_noise_reduction applies `noise_reduction` and restarts listening if active. select_camera switches the carousel camera.
      required: true
      default: "listen_toggle"
      selector:
        select:
          options:
            - "listen_start"
            - "listen_stop"
            - "listen_toggle"
            - "talk_message"
            - "quick_reply"
            - "unlock_door"
            - "call_target"
            - "set_noise_reduction"
            - "select_camera"
    camera_entity:
      name: Camera Entity
      description: Target camera.* entity (defaults to the device's active carousel camera).
      required: false
      selector:
        entity:
          domain: camera
    camera_index:
      name: Camera Carousel Index (0-9)
      description: Optional 0-based index in the 10-slot Camera Carousel.
      required: false
      selector:
        number:
          min: 0
          max: 9
          mode: box
    message:
      name: Spoken Message / Target Device
      description: Text to speak on the doorbell speaker (talk_message, quick_reply), or the device slug to ring for call_target (empty or "all" rings every other display).
      required: false
      selector:
        text:
    noise_reduction:
      name: Noise Reduction
      description: FFmpeg noise-reduction level for the doorbell listen stream (strong, light, off). Applies to this device until the integration reloads or Studio settings are saved; the default comes from Studio. Omit to keep the current level.
      required: false
      selector:
        select:
          options:
            - "strong"
            - "light"
            - "off"

reset_device:
  name: Reset Device to Defaults
  description: Reset a Latter device. Device settings erases everything saved on the device (its settings and the Wi-Fi driver's cached data) and restarts it; Wi-Fi credentials and the API key are compiled into the firmware, so it rejoins Home Assistant unchanged. Latter options puts this device's Latter options back to the defaults it got when it was added, keeping its ESPHome binding and its Music Assistant player link.
  fields:
    target_device:
      name: Target Device
      description: The Latter device to reset. Required; a reset never falls back to the only device.
      required: true
      selector:
        device:
          integration: latter
    device_settings:
      name: Device Settings
      description: Erase everything saved on the device and restart it. Needs Latter firmware SDK rev 2026110261 or later. Not available for BLE tags.
      required: false
      default: true
      selector:
        boolean:
    latter_options:
      name: Latter Options
      description: Reset this device's Latter options (Studio settings) to their defaults.
      required: false
      default: true
      selector:
        boolean:
