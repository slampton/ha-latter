music_browse:
  name: Music Browse
  description: Browse Music Assistant speakers, library, podcasts, and queues and push a 5-slot page to the ESPHome device.
  fields:
    target_device:
      name: Target ESPHome Device
      description: ESPHome device name (e.g., pocket-assistant).
      required: false
      default: "pocket-assistant"
      selector:
        text:
    mode:
      name: Browse Mode
      description: Category or drill-down mode to browse.
      required: true
      default: "speakers"
      selector:
        select:
          options:
            - "speakers"
            - "favorites"
            - "playlist"
            - "artist"
            - "album"
            - "radio"
            - "podcast"
            - "audiobook"
            - "track"
            - "artist_albums"
            - "album_tracks"
            - "current_album_tracks"
            - "active_queue"
            - "podcast_episodes"
    page:
      name: Page Number
      description: 1-based page index.
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 500
          mode: box
    page_size:
      name: Page Size
      description: Items per page (default 5).
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 5
          mode: box
    search:
      name: Search / Filter Context
      description: Artist name, Album URI/name, or Podcast URI for drill-down modes.
      required: false
      selector:
        text:
    speaker:
      name: Active Speaker
      description: Currently selected media_player entity_id.
      required: false
      selector:
        entity:
          domain: media_player
    last_speaker:
      name: Previous Speaker
      description: Previously active media_player entity_id for priority sorting.
      required: false
      selector:
        entity:
          domain: media_player
    album_sort:
      name: Album Sort Order
      description: Sort order when browsing library albums.
      required: false
      default: "name"
      selector:
        select:
          options:
            - "name"
            - "year_desc"
            - "year"
    artist_album_sort:
      name: Artist Album Sort Order
      description: Sort order when drilling into an artist's albums.
      required: false
      default: "year"
      selector:
        select:
          options:
            - "year"
            - "year_desc"
            - "name"
    podcast_sort:
      name: Podcast Episode Sort Order
      description: Sort order when browsing podcast episodes.
      required: false
      default: "newest"
      selector:
        select:
          options:
            - "newest"
            - "oldest"

set_active_speaker:
  name: Set Active Speaker
  description: Change the active target media_player for the Pocket Assistant or ESPHome device.
  fields:
    entity_id:
      name: Speaker Entity
      description: Target media_player entity_id.
      required: true
      selector:
        entity:
          domain: media_player
    target_device:
      name: Target ESPHome Device
      description: Optional ESPHome device slug when running multiple devices.
      required: false
      selector:
        text:

trigger_binding:
  name: Trigger Universal Hardware / Slot Binding
  description: Execute a user-mapped entity action bound to a hardware button, sensor, or UI slot ID in the Latter Web Companion Studio.
  fields:
    slot:
      name: Slot / Trigger ID
      description: Identifier sent by the ESPHome device (e.g., button_1, pir_occupied, macro_1).
      required: true
      selector:
        text:
    action:
      name: Action Override
      description: Optional override for the configured binding action.
      required: false
      selector:
        select:
          options:
            - "toggle"
            - "turn_on"
            - "turn_off"
            - "step_up"
            - "step_down"
            - "set_level"
    level:
      name: Level (0-100)
      description: Optional level percentage when action is set_level.
      required: false
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    target_device:
      name: Target ESPHome Device
      description: Optional ESPHome device slug.
      required: false
      selector:
        text:

media_volume:
  name: Media Volume Control (With AVR Override Support)
  description: Adjust or set volume on the active speaker (automatically routing to a mapped AV Receiver volume entity if configured).
  fields:
    target_device:
      name: Target ESPHome Device
      description: Optional ESPHome device slug.
      required: false
      selector:
        text:
    action:
      name: Volume Action
      description: Set level, step up/down, or toggle mute.
      required: false
      default: "set"
      selector:
        select:
          options:
            - "set"
            - "up"
            - "down"
            - "mute"
    volume_level:
      name: Volume Level (0.0-1.0 or 0-100)
      description: Target volume level.
      required: false
      selector:
        number:
          min: 0
          max: 100
          mode: slider

set_active_area:
  name: Set Active Room / Area (BLE Presence & Voice Sync)
  description: Switch the active room context by area_id or room name, sync the ESPHome device's HA area for room-aware Voice Assistant, and optionally hand off speaker/remote.
  fields:
    area:
      name: Area ID or Room Name
      description: Target Home Assistant area_id or friendly room name.
      required: true
      selector:
        text:
    handoff_media:
      name: Handoff Media Context
      description: Optional override for automatic room speaker & remote handoff.
      required: false
      selector:
        boolean:
    target_device:
      name: Target ESPHome Device
      description: Optional ESPHome device slug.
      required: false
      selector:
        text:

remote_action:
  name: TV / Media Remote Slot Action
  description: Select one of the 4 configured TV remote slots or send a remote command.
  fields:
    slot:
      name: Remote Slot (1-4)
      description: Target remote slot index (1 to 4).
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 4
          mode: box
    action:
      name: Action
      description: Command or slot selection action.
      required: true
      default: "select_slot"
      selector:
        select:
          options:
            - "select_slot"
            - "toggle"
            - "command"
            - "volume_up"
            - "volume_down"
            - "volume_mute"
            - "media_play_pause"
    command:
      name: Remote Command Key
      description: Key name for remote.send_command (e.g., up, down, left, right, select, back, home, menu).
      required: false
      selector:
        text:
    target_device:
      name: Target ESPHome Device
      description: Optional ESPHome device slug.
      required: false
      selector:
        text:

room_browse:
  name: Room Browse
  description: Browse Home Assistant areas, curated room entities, or home-wide alarm/pinned entities and push a 5-slot page to the ESPHome device.
  fields:
    target_device:
      name: Target ESPHome Device
      description: ESPHome device name (e.g., pocket-assistant).
      required: false
      default: "pocket-assistant"
      selector:
        text:
    mode:
      name: Browse Mode
      description: Browse areas list, entities inside an area, or home-wide alarm/entities.
      required: false
      default: "entities"
      selector:
        select:
          options:
            - "areas"
            - "entities"
            - "home"
    area_id:
      name: Area ID
      description: Target Home Assistant area_id (defaults to the device's active area).
      required: false
      selector:
        area:
    domain_filter:
      name: Domain Filter
      description: Filter room entities by domain.
      required: false
      default: "all"
      selector:
        select:
          options:
            - "all"
            - "light"
            - "scene"
            - "cover"
            - "fan"
            - "switch"
            - "climate"
            - "media_player"
    page:
      name: Page Number
      description: 1-based page index.
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 100
          mode: box
    page_size:
      name: Page Size
      description: Items per page (default 5).
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 5
          mode: box
    handoff_media:
      name: Handoff Area Media Context
      description: Automatically switch active speaker and TV remote to the selected room.
      required: false
      selector:
        boolean:

room_action:
  name: Room & Alarm Action
  description: Execute a normalized room control or home alarm action (toggle, turn_on, turn_off, set_level, arm_home, arm_away, arm_night, disarm).
  fields:
    target_device:
      name: Target ESPHome Device
      description: ESPHome device name (e.g., pocket-assistant).
      required: false
      default: "pocket-assistant"
      selector:
        text:
    entity_id:
      name: Target Entity
      description: Light, cover, climate, fan, switch, scene, or alarm_control_panel entity_id (if omitted for alarm actions, uses configured Home Alarm).
      required: false
      selector:
        entity:
    area_id:
      name: Switch Active Area ID
      description: Optional area_id to set as the active room context.
      required: false
      selector:
        area:
    action:
      name: Action
      description: Normalized command to execute on the entity.
      required: false
      default: "toggle"
      selector:
        select:
          options:
            - "toggle"
            - "turn_on"
            - "turn_off"
            - "set_level"
            - "step_up"
            - "step_down"
            - "arm_home"
            - "arm_away"
            - "arm_night"
            - "arm_vacation"
            - "disarm"
    level:
      name: Level / Temperature (0-100)
      description: Brightness %, cover position %, fan speed %, or target temperature.
      required: false
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    code:
      name: Alarm PIN Code
      description: Optional PIN code when arming or disarming an alarm_control_panel.
      required: false
      selector:
        text:

calendar_fetch:
  name: Calendar Fetch Agenda
  description: Refresh upcoming family calendar events and push a 5-slot agenda page to the ESPHome device.
  fields:
    target_device:
      name: Target ESPHome Device
      description: ESPHome device name (e.g., pocket-assistant).
      required: false
      default: "pocket-assistant"
      selector:
        text:
    days:
      name: Lookahead Days
      description: Number of days ahead to query (default 7).
      required: false
      default: 7
      selector:
        number:
          min: 1
          max: 30
          mode: box
    page:
      name: Page Number
      description: 1-based page index.
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 20
          mode: box

calendar_create_event:
  name: Calendar Create Event
  description: Create a new event on the primary family calendar and refresh the agenda sensor.
  fields:
    target_device:
      name: Target ESPHome Device
      description: ESPHome device name (e.g., pocket-assistant).
      required: false
      default: "pocket-assistant"
      selector:
        text:
    calendar_entity:
      name: Calendar Entity
      description: Target calendar.* entity (defaults to primary configured calendar).
      required: false
      selector:
        entity:
          domain: calendar
    summary:
      name: Event Summary / Title
      description: Title of the calendar event.
      required: true
      selector:
        text:
    start_date_time:
      name: Start Date & Time
      description: ISO 8601 start datetime string.
      required: true
      selector:
        text:
    end_date_time:
      name: End Date & Time
      description: ISO 8601 end datetime string.
      required: true
      selector:
        text:
    description:
      name: Description
      description: Optional event notes or description.
      required: false
      selector:
        text:

intercom_broadcast:
  name: Household Intercom Broadcast
  description: Broadcast a TTS announcement or recorded audio clip to one or all household media_player speakers.
  fields:
    message:
      name: Announcement Message (TTS)
      description: Text message to announce via Home Assistant TTS.
      required: false
      selector:
        text:
    media_url:
      name: Audio Clip URL
      description: Optional HTTP URL to an audio clip to play with announce=true.
      required: false
      selector:
        text:
    target_speakers:
      name: Target Speakers
      description: Specific media_player entities to broadcast to (defaults to all active speakers).
      required: false
      selector:
        entity:
          domain: media_player
          multiple: true
    tts_entity:
      name: TTS Engine Entity
      description: Optional tts.* entity (auto-discovered if omitted).
      required: false
      selector:
        entity:
          domain: tts

media_command:
  name: Unified Media Command (With Post-Reboot Queue Resumption)
  description: Execute playback controls (play, pause, toggle, next, previous, stop, seek, play_media, clear_queue) on the active speaker, automatically re-streaming the Music Assistant queue if the local ESPHome Sendspin buffer was emptied by a reboot or hibernate.
  fields:
    target_device:
      name: Target ESPHome Device
      description: Optional ESPHome device slug (defaults to pocket-assistant).
      required: false
      default: "pocket-assistant"
      selector:
        text:
    command:
      name: Playback Command
      description: Media transport command to execute.
      required: true
      default: "toggle"
      selector:
        select:
          options:
            - "play"
            - "pause"
            - "toggle"
            - "next"
            - "previous"
            - "stop"
            - "seek"
            - "play_media"
            - "clear_queue"
    seek_position:
      name: Seek Position (Seconds)
      description: Target playback position in seconds when command is seek.
      required: false
      selector:
        number:
          min: 0
          max: 36000
          mode: box
    media_id:
      name: Media URI / ID
      description: Optional Music Assistant URI or media_content_id when command is play_media.
      required: false
      selector:
        text:
    media_type:
      name: Media Type
      description: Optional media type (music, podcast, audiobook, radio, playlist, album, track).
      required: false
      selector:
        text: