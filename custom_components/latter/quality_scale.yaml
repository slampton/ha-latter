rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: Event-driven local push middleware for ESPHome and Home Assistant state changes.
  brands: done
  common-modules:
    status: done
    comment: Acyclic L0a-L4 DAG layout across focused subpackages (areas/, cameras/, coordinator/, groups/, http/, media/, presence/, services/, studio/, wallpapers/), shared root modules (const.py, config_defaults.py, repairs_keys.py, protocol_*.py, media_cache.py, hub_registry.py, hub_sync.py, identity.py, feeds.py, remotes.py, doorbell*.py, backup.py, repairs.py, diagnostics.py), and 8 entity platforms, verified cycle-free by tools/verify_ha.py.
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: Integration exposes entities and services rather than custom automation conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: Integration exposes entities and events rather than custom device automation triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment: Hub and coordinator runtime state stored on typed ConfigEntry.runtime_data (LatterConfigEntry = ConfigEntry[LatterRuntimeData]).
  test-before-configure: done
  test-before-setup:
    status: exempt
    comment: Local push middleware bound to ESPHome devices that may sleep on battery at startup and answer latter_ping asynchronously when awake.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Local push ESPHome middleware; authentication is managed by the ESPHome integration and signed local resource signatures.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: done
    comment: Device and BLE Tag subentries implement async_step_reconfigure for in-place hardware rebind and reconfiguration, while config_panel_domain routes hub Configure directly to Latter Studio (/latter).
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency:
    status: exempt
    comment: Integration coordinates Home Assistant core platforms and local ESPHome services without an external device library.
  inject-websession:
    status: exempt
    comment: Integration does not use an external API client library; local HTTP proxy views use Home Assistant's shared aiohttp session.
  strict-typing: done
