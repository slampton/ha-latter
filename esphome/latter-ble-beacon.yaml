# ==============================================================================
# Latter 1-Line Drop-In Mixin: Roaming BLE Room Presence Beacon
# Usage in any ESP32 device YAML:
#   packages:
#     latter.ble: github://slampton/ha-latter/esphome/latter-ble-beacon.yaml@main
# ==============================================================================

substitutions:
  latter_ble_uuid: "504F434B-4554-4153-5354-000000000210"

api:
  actions:
    - action: latter_ping
      then:
        - logger.log: "Latter BLE Room Presence Mixin active"

esp32_ble:
  id: latter_ble_ctrl
  enable_on_boot: true

esp32_ble_beacon:
  type: iBeacon
  uuid: "${latter_ble_uuid}"
  major: 1
  minor: 1
  measured_power: -59
  tx_power: 3dBm
  min_interval: 500ms
  max_interval: 1000ms

switch:
  - platform: template
    name: "Room: BLE Presence Beacon"
    id: latter_ble_beacon_switch
    icon: "mdi:bluetooth-audio"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(latter_ble_beacon_switch).publish_state(true);
          if (!id(latter_ble_ctrl).is_active()) {
            id(latter_ble_ctrl).enable();
          }
    turn_off_action:
      - lambda: |-
          id(latter_ble_beacon_switch).publish_state(false);
          if (id(latter_ble_ctrl).is_active()) {
            id(latter_ble_ctrl).disable();
          }