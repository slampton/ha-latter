# ==============================================================================
# Latter 1-Line Drop-In Mixin: Roaming WireGuard VPN & Outgoing API Tunnel
# Usage in any ESPHome device YAML:
#   packages:
#     latter.vpn: github://slampton/ha-latter/esphome/latter-vpn.yaml@main
#
# Required entries in your ESPHome secrets.yaml (generated in Latter Studio):
#   latter_vpn_private_key: "<DEVICE_PRIVATE_KEY>"
#   latter_vpn_endpoint: "<YOUR_WG_HOST_OR_IP>"
#   latter_vpn_server_public_key: "<SERVER_PUBLIC_KEY>"
#   latter_vpn_preshared_key: "<PRESHARED_KEY>"
# ==============================================================================

substitutions:
  latter_vpn_ip: "10.10.10.2"
  latter_vpn_netmask: "255.255.255.0"
  latter_vpn_allowed_subnet: "10.10.10.0/24"
  latter_vpn_port: "51820"

api:
  outgoing_connection:
  actions:
    - action: latter_ping
      then:
        - logger.log: "Latter Roaming WireGuard VPN Mixin active"

wireguard:
  id: latter_wg_tunnel
  address: ${latter_vpn_ip}
  netmask: ${latter_vpn_netmask}
  private_key: !secret latter_vpn_private_key
  peer_endpoint: !secret latter_vpn_endpoint
  peer_port: ${latter_vpn_port}
  peer_public_key: !secret latter_vpn_server_public_key
  peer_preshared_key: !secret latter_vpn_preshared_key
  peer_persistent_keepalive: 25s
  allowed_ips:
    - ${latter_vpn_allowed_subnet}

binary_sensor:
  - platform: wireguard
    status:
      name: "System: VPN Tunnel Connected"
      entity_category: diagnostic
    enabled:
      name: "System: VPN Tunnel Enabled"
      entity_category: diagnostic

sensor:
  - platform: wireguard
    latest_handshake:
      name: "System: VPN Latest Handshake"
      entity_category: diagnostic