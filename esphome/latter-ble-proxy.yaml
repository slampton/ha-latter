# ==============================================================================
# Latter 1-Line Drop-In Mixin: Stationary Room BLE Scanner Proxy
# Usage in any mains-powered ESP32 device YAML:
#   packages:
#     latter.proxy: github://slampton/ha-latter/esphome/latter-ble-proxy.yaml@main
# ==============================================================================

api:
  actions:
    - action: latter_ping
      then:
        - logger.log: "Latter Stationary BLE Scanner Proxy Mixin active"

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true