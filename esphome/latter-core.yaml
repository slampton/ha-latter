# ==============================================================================
# Latter 1-Line Drop-In Mixin: Core Studio Discovery & Diagnostics
# Usage in any ESPHome device YAML:
#   packages:
#     latter.core: github://slampton/ha-latter/esphome/latter-core.yaml@main
# ==============================================================================

api:
  actions:
    - action: latter_ping
      then:
        - logger.log: "Latter Core Mixin active"

button:
  - platform: restart
    name: "Actions: Restart Device"
    icon: "mdi:restart"
    entity_category: diagnostic

sensor:
  - platform: uptime
    name: "System: Uptime"
    entity_category: diagnostic

  - platform: wifi_signal
    name: "System: Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic